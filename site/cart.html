<main>
<h1>Your cart</h1>
<div class="card" id="cart"></div>
</main>
<footer>Northwind Outdoor is a fictional store built to demonstrate a GA4 measurement setup. No real orders are taken. <a href="#" id="cookie-settings">Cookie settings</a></footer>
<script>
const items = cartItems();
const box = document.getElementById("cart");
if (!items.length) {
  box.innerHTML = '<p>Your cart is empty. <a href="index.html">Keep shopping</a>.</p>';
} else {
  box.innerHTML = `<table><tr><th>Item</th><th>Qty</th><th>Price</th></tr>
    ${items.map(i => `<tr><td>${i.item_name}</td><td>${i.quantity}</td><td>€${(i.price * i.quantity).toFixed(2)}</td></tr>`).join("")}
    </table><p class="price">Total: €${cartValue(items).toFixed(2)}</p>
    <a class="btn" href="checkout.html">Checkout</a>`;
}
</script>
