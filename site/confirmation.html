<main>
<h1>Thank you!</h1>
<div class="card" id="confirm"></div>
</main>
<footer>Northwind Outdoor is a fictional store built to demonstrate a GA4 measurement setup. No real orders are taken.</footer>
<script>
const orderId = new URLSearchParams(location.search).get("order");
let order = null;
try { order = JSON.parse(sessionStorage.getItem("nw_order_" + orderId)); } catch (e) {}
const box = document.getElementById("confirm");

if (!order) {
  box.innerHTML = "<p>Order not found.</p>";
} else {
  box.innerHTML = `<p>Order <strong>${order.transaction_id}</strong> confirmed.</p>
    <p class="price">Total: €${order.value.toFixed(2)}</p>`;

  // purchase: sent once per order. A refresh of this page must not send it again,
  // so the IDs already sent are remembered. GA4 also deduplicates on transaction_id,
  // but stopping the duplicate at the source keeps every downstream tool clean.
  let sent = [];
  try { sent = JSON.parse(localStorage.getItem("nw_sent_orders")) || []; } catch (e) {}
  if (!sent.includes(order.transaction_id)) {
    pushEcommerce("purchase", {
      transaction_id: order.transaction_id,
      currency: CURRENCY,
      value: order.value,
      items: order.items,
    });
    sent.push(order.transaction_id);
    try { localStorage.setItem("nw_sent_orders", JSON.stringify(sent.slice(-50))); } catch (e) {}
  }
}
</script>
