<main>
<h1>Checkout</h1>
<div class="card">
  <p class="muted">Demo checkout: no payment details are collected.</p>
  <p class="price" id="total"></p>
  <button class="btn" id="place">Place order</button>
</div>
</main>
<footer>Northwind Outdoor is a fictional store built to demonstrate a GA4 measurement setup. No real orders are taken.</footer>
<script>
const items = cartItems();
if (!items.length) {
  // An empty cart can't start a checkout: send the user back without pushing any event.
  location.replace("cart.html");
} else {
  const value = cartValue(items);
  document.getElementById("total").textContent = `Total: €${value.toFixed(2)}`;

  // begin_checkout: fires when the checkout page loads with a non-empty cart.
  pushEcommerce("begin_checkout", { currency: CURRENCY, value: value, items: items });

  document.getElementById("place").addEventListener("click", () => {
    // The order (and its unique ID) is created here, the way a real backend would.
    // The purchase event is NOT sent yet: it waits for the confirmation page.
    const order = {
      transaction_id: "NW-" + Date.now() + "-" + Math.floor(Math.random() * 1000),
      value: value,
      items: items,
    };
    try { sessionStorage.setItem("nw_order_" + order.transaction_id, JSON.stringify(order)); } catch (e) {}
    writeCart([]);
    location.href = "confirmation.html?order=" + encodeURIComponent(order.transaction_id);
  });
}
</script>
