<main>
<div class="card" id="product"></div>
</main>
<footer>Northwind Outdoor is a fictional store built to demonstrate a GA4 measurement setup. No real orders are taken. <a href="#" id="cookie-settings">Cookie settings</a></footer>
<script>
const id = new URLSearchParams(location.search).get("id");
const p = CATALOG[id];
const box = document.getElementById("product");
if (!p) {
  box.innerHTML = "<p>Product not found.</p>";
} else {
  box.innerHTML = `<h1>${p.item_name}</h1><p class="muted">${p.item_category}</p>
    <p class="price">€${p.price.toFixed(2)}</p>
    <label for="qty">Quantity</label><input id="qty" type="number" min="1" value="1" style="max-width:100px">
    <p><button class="btn" id="add">Add to cart</button> <a class="btn secondary" href="cart.html">View cart</a></p>
    <p class="notice" id="added" hidden>Added to cart.</p>`;

  // view_item: fires once when the product page loads.
  const item = toItem(id, 1);
  pushEcommerce("view_item", { currency: CURRENCY, value: item.price, items: [item] });

  // add_to_cart: fires on each click, with the chosen quantity.
  document.getElementById("add").addEventListener("click", () => {
    const qty = Math.max(1, parseInt(document.getElementById("qty").value, 10) || 1);
    addToCart(id, qty);
    document.getElementById("added").hidden = false;
  });
}
</script>
